<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a7d4b"><link rel="manifest" href="manifest.webmanifest"><title>RPFVA Field Sheet</title>
<style>:root{--bg:#fff;--fg:#1a1a1a;--mu:#666;--cd:#f3f5f4;--bd:#cfd6d2;--ac:#0a7d4b;--rd:#c0392b}@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--mu:#9a9a9a;--cd:#1e1e1e;--bd:#3a3a3a;--ac:#3ecf8e;--rd:#ff6b5b}}
*{box-sizing:border-box}body{margin:0;padding:12px;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:640px;margin:auto}h1{font-size:19px;margin:4px 0}h2{font-size:15px;margin:18px 0 6px;color:var(--ac)}
#bar{position:sticky;top:0;z-index:5;padding:8px 10px;border-radius:8px;background:var(--ac);color:#fff;font-size:13px}#bar.w{background:var(--rd)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 2px}input,select,textarea,button{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}button.s{background:var(--cd);color:var(--fg);border:1px solid var(--bd)}button.d{background:none;color:var(--rd);border:1px solid var(--rd)}
.r{display:flex;gap:8px}.r>*{flex:1}.r>.n{flex:0 0 auto;width:auto}.it{background:var(--cd);border-radius:8px;padding:8px 10px;margin:6px 0;display:flex;align-items:center;gap:8px}.it span{flex:1;font-size:14px}.it button{width:auto;padding:6px 10px;font-size:13px}.mu{color:var(--mu);font-size:12px}</style></head><body>
<h1>🌳 RPFVA Field Sheet</h1><div id="bar"></div>
<div class="mu" id="edit"></div><div id="f"></div>
<div class="r" style="margin-top:14px"><button id="sv">💾 Save site</button><button class="s" id="nw">New blank</button></div>
<h2>Saved on this phone (<span id="cnt">0</span>)</h2><div id="l"></div>
<h2>Backup</h2><button id="ex">⬇ Download ALL sites (one CSV sheet)</button>
<div class="r" style="margin-top:8px"><button class="s" id="bj">⬇ Backup file (.json)</button><button class="s" id="rj">⬆ Restore backup</button></div><input type="file" id="fi" accept=".json" hidden>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ab" style="width:auto" checked> Auto-download a backup CSV after every save</label>
<p class="mu">Everything you type is saved on this phone instantly, even with no network or if the page closes. Download a backup CSV regularly and send it when you have signal.</p>
<script>
const O={pos:['Upper slope','Middle slope','Lower slope','Valley','Ridge / hilltop','Flat / plateau','Other'],veg:['Natural forest','Woodland, Bushland / Shrubland','Riparian vegetation','Farmland with scattered trees','Plantation','Grassland','Other'],st:['Dense','Moderate','Open','Very sparse'],ab:['None','Few','Moderate','Many'],ds:['No','No / Observed','Yes','Yes / Observed']};
const DN=['Tree cutting / harvesting','Charcoal production','Fuelwood collection','Fire damage','Grazing / browsing','Agricultural encroachment','Settlement / infrastructure development','Soil erosion'];
const F=[['Sheet No','t'],['Village','t'],['GPS','g'],['Landscape position','s',O.pos],['Landscape other','t'],['Main vegetation type','s',O.veg],['Plantation species','t'],['Vegetation structure','s',O.st],['Tree canopy cover (%)','n'],['Dominant tree species','t'],['Dominant shrubs / grasses','t'],['Trees >=10 cm DBH (10 m plot)','n'],['Stumps (10 m plot)','n'],['Seedlings (5 m plot)','s',O.ab],['Saplings (5 m plot)','s',O.ab],['Coppices / root suckers (5 m plot)','s',O.ab],...DN.map(d=>['Disturbance: '+d,'s',O.ds]),['Disturbance: Other','t'],['Photo 1 ID / observation','a'],['Photo 2 ID / observation','a'],['Photo 3 ID / observation','a'],['Photo 4 ID / observation','a'],['Name','t'],['Signature','t'],['Date','d']];
const $=s=>document.querySelector(s),KEY='rpfva_v1',today=()=>new Date().toISOString().slice(0,10);
let S={recs:[],trash:[],draft:{},lastExp:0,ts:0},persisted=false;
function idb(){return new Promise((a,b)=>{const r=indexedDB.open('rpfva',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>a(r.result);r.onerror=b})}
async function idbSet(v){try{(await idb()).transaction('s','readwrite').objectStore('s').put(v,'state')}catch(e){}}
async function idbGet(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('s').objectStore('s').get('state');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
function persist(){S.ts=Date.now();const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}idbSet(j);bar()}
function bar(){const n=S.recs.filter(r=>r.upd>S.lastExp).length,b=$('#bar');b.className=n?'w':'';b.textContent=S.recs.length+' saved · '+(n?n+' NOT yet downloaded':'all downloaded')+' · protected storage: '+(persisted?'yes':'no (download backups!)');$('#cnt').textContent=S.recs.length}
const nextNo=()=>String(Math.max(0,...S.recs.map(r=>parseInt(r['Sheet No'])||0))+1).padStart(2,'0');
function blank(){S.draft={Date:today(),'Sheet No':nextNo()};fill();persist()}
function fill(){document.querySelectorAll('[data-k]').forEach(e=>e.value=S.draft[e.dataset.k]||'');$('#edit').textContent=S.draft.id?'Editing saved sheet '+S.draft['Sheet No']:'New sheet (autosaved as draft)'}
function build(){$('#f').innerHTML=F.map(([k,t,o])=>{const l=`<label>${k}</label>`;if(t=='s')return l+`<select data-k="${k}"><option value=""></option>${o.map(x=>`<option>${x}</option>`).join('')}</select>`;if(t=='a')return l+`<textarea rows="2" data-k="${k}"></textarea>`;if(t=='g')return l+`<div class="r"><input data-k="${k}" placeholder="-3.832664, 35.686475" inputmode="text"><button class="s n" type="button" id="gp">📍 GPS</button></div>`;return l+`<input data-k="${k}" type="${t=='n'?'number':t=='d'?'date':'text'}" ${t=='n'?'inputmode="decimal"':''}>`}).join('');
document.querySelectorAll('[data-k]').forEach(e=>e.addEventListener('input',()=>{S.draft[e.dataset.k]=e.value;persist()}));
$('#gp').onclick=()=>{const b=$('#gp');b.textContent='…';navigator.geolocation.getCurrentPosition(p=>{const v=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6),e=document.querySelector('[data-k="GPS"]');e.value=v;S.draft.GPS=v;persist();b.textContent='📍 GPS'},()=>{b.textContent='📍 GPS';alert('No GPS fix. Type it in manually.')},{enableHighAccuracy:true,timeout:30000})}}
function save(){const d=S.draft;if(!d['Sheet No']){alert('Enter Sheet No first');return}
if(S.recs.some(r=>r.id!=d.id&&r['Sheet No']==d['Sheet No'])&&!confirm('Sheet '+d['Sheet No']+' already saved. Save as a second copy?'))return;
const r={...d,id:d.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6),upd:Date.now()},i=S.recs.findIndex(x=>x.id==r.id);i<0?S.recs.push(r):S.recs[i]=r;
blank();list();if($('#ab').checked)exportCSV();scrollTo(0,0)}
function list(){$('#l').innerHTML=S.recs.slice().sort((a,b)=>b.upd-a.upd).map(r=>`<div class="it"><span><b>${esc(r['Sheet No'])}</b> ${esc(r.Village||'')} <i class="mu">${new Date(r.upd).toLocaleString()}</i></span><button class="s" data-e="${r.id}">Edit</button><button class="d" data-x="${r.id}">✕</button></div>`).join('');bar()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#l').onclick=e=>{const id=e.target.dataset.e||e.target.dataset.x,r=S.recs.find(x=>x.id==id);if(!r)return;if(e.target.dataset.e){S.draft={...r};fill();persist();scrollTo(0,0)}else if(confirm('Remove sheet '+r['Sheet No']+'? (a copy stays in the backup file)')){S.trash.push(r);S.recs=S.recs.filter(x=>x.id!=id);list();persist()}};
const q=v=>{v=v==null?'':String(v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function exportCSV(){const names=F.map(f=>f[0]),H=['Sheet No','Village','GPS','Latitude','Longitude',...names.slice(3).map(n=>n.replace(' (%)','')),'Fields filled','Source file(s)'];
const rows=S.recs.slice().sort((a,b)=>(a['Sheet No']>b['Sheet No']?1:-1)).map(r=>{const m=(r.GPS||'').match(/-?\d+(\.\d+)?/g)||[],c=r['Tree canopy cover (%)'],v=[r['Sheet No'],r.Village,r.GPS,m[0],m[1],...names.slice(3).map(n=>n=='Tree canopy cover (%)'&&c!==''&&c!=null?c/100:r[n])],k=v.slice(5,34).filter(x=>x!==''&&x!=null).length;return[...v,k+' / 29','app'].map(q).join(',')});
dl('RPFVA_all_sites_'+today()+'.csv','\ufeff'+[H.map(q).join(','),...rows].join('\r\n'),'text/csv;charset=utf-8');S.lastExp=Date.now();persist()}
$('#ex').onclick=exportCSV;$('#sv').onclick=save;$('#nw').onclick=()=>{if(confirm('Start a blank sheet? The current draft is kept only if you saved it.'))blank()};
$('#bj').onclick=()=>{dl('RPFVA_backup_'+today()+'.json',JSON.stringify(S),'application/json');S.lastExp=Date.now();persist()};
$('#rj').onclick=()=>$('#fi').click();$('#fi').onchange=async e=>{try{const b=JSON.parse(await e.target.files[0].text());(b.recs||[]).concat(b.trash||[]).forEach(r=>{if(!S.recs.some(x=>x.id==r.id))S.recs.push(r)});list();persist();alert('Restored')}catch(x){alert('Not a valid backup file')}};
(async()=>{let a=null,b=null;try{a=JSON.parse(localStorage.getItem(KEY))}catch(e){}try{b=JSON.parse(await idbGet())}catch(e){}
S={...S,...[a,b].filter(Boolean).sort((x,y)=>y.ts-x.ts)[0]};if(a&&b){[a,b].forEach(s=>s.recs.forEach(r=>{if(!S.recs.some(x=>x.id==r.id))S.recs.push(r)}))}
build();if(!S.draft||!Object.keys(S.draft).length)S.draft={Date:today(),'Sheet No':nextNo()};fill();list();
try{if(navigator.storage&&navigator.storage.persist){persisted=await navigator.storage.persist()}}catch(e){}persist();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
